name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays
  push:
    branches: [ main ]
    paths:
    - Cargo.lock
    - '**/Cargo.toml'
    - deny.toml
    - .cargo/audit.toml
    - .github/workflows/security.yml
  pull_request:
    branches: [ main ]
    paths:
    - Cargo.lock
    - '**/Cargo.toml'
    - deny.toml
    - .cargo/audit.toml
    - .github/workflows/security.yml

permissions:
  contents: read

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install cargo-audit
      uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b
      with:
        tool: cargo-audit
        fallback: none
    - run: cargo audit
